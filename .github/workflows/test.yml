# Runs the fast unit tests on every push and pull request.
# (The browser tests drive a real window and run on your own machine with `npm test`.)
name: Tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:unit
